# security/modsecurity.conf (minimal)
SecRuleEngine On
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "multipart/form-data" "phase:1,pass,id:90001"
SecAction "id:900130,phase:1,pass,nolog,initcol:global=global,initcol:ip=%{REMOTE_ADDR}"
# Basic SQLi rule (demo)
SecRule ARGS "(union.*select|select.*from|drop\s+table|information_schema)" \
  "phase:2,deny,status:403,id:1000001,msg:'SQLi attempt',log"
